name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the build whenever you push new changes to the main branch

permissions:
  contents: write # Allows the runner to push built code to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite compiles everything into the 'dist' folder
          branch: gh-pages # Deploys the compiled files directly to your hosting branch